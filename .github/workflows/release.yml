name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            os-name: Windows
            artifact-ext: .exe
          - platform: macos-latest
            os-name: macOS
            artifact-ext: .dmg
          - platform: ubuntu-22.04
            os-name: Linux
            artifact-ext: .AppImage

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - name: Install frontend dependencies
        run: bun install

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Humn ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads

            | Platform | Installer |
            |---|---|
            | Windows | `.exe` (NSIS installer) |
            | macOS | `.dmg` |
            | Linux | `.AppImage` |

            ## Installation
            - **Windows**: Run the `.exe` installer. Requires Windows 10/11.
            - **macOS**: Open the `.dmg` and drag Humn to Applications.
            - **Linux**: Make the `.AppImage` executable (`chmod +x`) and run it. Requires an MPRIS-compatible player.
          releaseDraft: false
          prerelease: false
